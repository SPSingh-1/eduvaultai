<div class="absolute inset-0 w-full h-full rounded-3xl overflow-hidden glass-panel ai-glow" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.getElementById('threejs-container-ANIMATION_10');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const brainGroup = new THREE.Group();
scene.add(brainGroup);

// Create a more "neural" brain shape using a cluster of spheres
const points = [];
for (let i = 0; i < 60; i++) {
    const phi = Math.acos(-1 + (2 * i) / 60);
    const theta = Math.sqrt(60 * Math.PI) * phi;
    
    const x = Math.cos(theta) * Math.sin(phi);
    const y = Math.sin(theta) * Math.sin(phi);
    const z = Math.cos(phi);
    
    points.push(new THREE.Vector3(x * 1.5, y * 1.5, z * 1.5));
}

const nodeGeometry = new THREE.SphereGeometry(0.06, 12, 12);
const nodeMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x2563EB, 
    emissive: 0x2563EB, 
    emissiveIntensity: 0.5,
    shininess: 100 
});

const nodes = [];
points.forEach(p => {
    const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
    node.position.copy(p);
    brainGroup.add(node);
    nodes.push(node);
});

// Connections
const lineMaterial = new THREE.LineBasicMaterial({ 
    color: 0x10B981, 
    transparent: true, 
    opacity: 0.2 
});

for (let i = 0; i < nodes.length; i++) {
    const lineGeometry = new THREE.BufferGeometry();
    const connections = [];
    for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[i].position.distanceTo(nodes[j].position) < 1.2) {
            connections.push(nodes[i].position.x, nodes[i].position.y, nodes[i].position.z);
            connections.push(nodes[j].position.x, nodes[j].position.y, nodes[j].position.z);
        }
    }
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(connections, 3));
    const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
    brainGroup.add(lineSegments);
}

const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 4;

function animate() {
    requestAnimationFrame(animate);
    brainGroup.rotation.y += 0.003;
    brainGroup.rotation.x += 0.001;
    
    const time = Date.now() * 0.001;
    nodes.forEach((node, i) => {
        const pulse = 1 + Math.sin(time + i) * 0.1;
        node.scale.set(pulse, pulse, pulse);
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>

<script>
        // Simple Confetti Effect
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ['#b4c5ff', '#4edea3', '#c0c1ff', '#ffffff']; // Primary, Secondary, Tertiary, White

        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 4 + 1,
                dx: Math.random() * 2 - 1,
                dy: Math.random() * 3 + 1,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.floor(Math.random() * 10) - 10,
                tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
                tiltAngle: 0
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
            }
            update();
            requestAnimationFrame(draw);
        }

        function update() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.tiltAngle += p.tiltAngleIncrement;
                p.y += (Math.cos(p.tiltAngle) + p.dy + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;

                if (p.y > canvas.height) {
                    p.x = Math.random() * canvas.width;
                    p.y = -10;
                    p.tilt = Math.floor(Math.random() * 10) - 10;
                }
            }
        }

        draw();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
