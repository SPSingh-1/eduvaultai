<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Group to hold the brain/network
const brainGroup = new THREE.Group();
scene.add(brainGroup);

// Create nodes
const nodeCount = 40;
const nodes = [];
const nodeGeometry = new THREE.SphereGeometry(0.05, 16, 16);
const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x8B5CF6 });

for (let i = 0; i < nodeCount; i++) {
    const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
    node.position.set(
        (Math.random() - 0.5) * 4,
        (Math.random() - 0.5) * 4,
        (Math.random() - 0.5) * 4
    );
    // Move closer to a sphere/brain shape
    node.position.normalize().multiplyScalar(1.5 + Math.random() * 0.5);
    brainGroup.add(node);
    nodes.push(node);
}

// Create connection lines
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x2563EB, transparent: true, opacity: 0.3 });
const lineGeometry = new THREE.BufferGeometry();
const linePositions = [];

// Connect each node to 2-3 closest neighbors
for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
        const dist = nodes[i].position.distanceTo(nodes[j].position);
        if (dist < 1.2) {
            linePositions.push(nodes[i].position.x, nodes[i].position.y, nodes[i].position.z);
            linePositions.push(nodes[j].position.x, nodes[j].position.y, nodes[j].position.z);
        }
    }
}
lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
brainGroup.add(lines);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    brainGroup.rotation.y += 0.005;
    brainGroup.rotation.x += 0.002;
    
    // Pulse effect
    const time = Date.now() * 0.002;
    nodes.forEach((node, i) => {
        const scale = 1 + Math.sin(time + i) * 0.2;
        node.scale.set(scale, scale, scale);
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
