<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.getElementById('threejs-container-ANIMATION_10');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const brainGroup = new THREE.Group();
scene.add(brainGroup);

// Create a more "neural" brain shape using a cluster of spheres
const points = [];
for (let i = 0; i < 60; i++) {
    const phi = Math.acos(-1 + (2 * i) / 60);
    const theta = Math.sqrt(60 * Math.PI) * phi;
    
    const x = Math.cos(theta) * Math.sin(phi);
    const y = Math.sin(theta) * Math.sin(phi);
    const z = Math.cos(phi);
    
    points.push(new THREE.Vector3(x * 1.5, y * 1.5, z * 1.5));
}

const nodeGeometry = new THREE.SphereGeometry(0.06, 12, 12);
const nodeMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x2563EB, 
    emissive: 0x2563EB, 
    emissiveIntensity: 0.5,
    shininess: 100 
});

const nodes = [];
points.forEach(p => {
    const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
    node.position.copy(p);
    brainGroup.add(node);
    nodes.push(node);
});

// Connections
const lineMaterial = new THREE.LineBasicMaterial({ 
    color: 0x10B981, 
    transparent: true, 
    opacity: 0.2 
});

for (let i = 0; i < nodes.length; i++) {
    const lineGeometry = new THREE.BufferGeometry();
    const connections = [];
    for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[i].position.distanceTo(nodes[j].position) < 1.2) {
            connections.push(nodes[i].position.x, nodes[i].position.y, nodes[i].position.z);
            connections.push(nodes[j].position.x, nodes[j].position.y, nodes[j].position.z);
        }
    }
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(connections, 3));
    const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
    brainGroup.add(lineSegments);
}

const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 4;

function animate() {
    requestAnimationFrame(animate);
    brainGroup.rotation.y += 0.003;
    brainGroup.rotation.x += 0.001;
    
    const time = Date.now() * 0.001;
    nodes.forEach((node, i) => {
        const pulse = 1 + Math.sin(time + i) * 0.1;
        node.scale.set(pulse, pulse, pulse);
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->
</body>
</html>
